<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>成人高考平台管理</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


</head>



<body>



<!-- 顶部 -->

<div class="top-bar">


<div class="logo">

成人高考平台管理

</div>



<div class="admin">


超级管理员


<button onclick="logout()">

退出登录

</button>


</div>



</div>







<div class="layout">





<!-- 左侧菜单 -->


<div class="sidebar">



<div class="menu-title">

学生管理

</div>



<button onclick="showGaokao()">

成高学生

</button>



<button onclick="showZikao()">

自考学生

</button>



<button onclick="showGraduated()">

毕业名单

</button>





<div class="menu-title">

系统功能

</div>



<button>

招生管理

</button>



<button>

数据统计

</button>



<button>

设置

</button>



</div>









<!-- 右侧内容 -->


<div class="main">





<!-- 搜索 -->


<div class="search-box">


<input

id="search"

placeholder="搜索姓名/手机号/专业/年份">


<button onclick="searchStudent()">

搜索

</button>



<button onclick="resetSearch()">

重置

</button>


</div>







<!-- 操作按钮 -->


<div class="toolbar">


<button onclick="openAdd()">

+ 新增学生

</button>



<input

type="file"

id="excelFile"

accept=".xlsx,.xls">



<button onclick="importExcel()">

导入

</button>



<button onclick="exportExcel()">

导出

</button>



</div>









<!-- 数据表 -->


<div class="table-box">


<table>



<thead>


<tr>


<th>
姓名
</th>


<th>
学校
</th>


<th>
手机号
</th>


<th>
专业
</th>


<th>
层次
</th>


<th>
入学时间
</th>


<th>
操作
</th>


</tr>


</thead>




<tbody id="list">


</tbody>



</table>



</div>









<!-- 分页 -->


<div class="page">


<button onclick="prevPage()">

上一页

</button>



<span id="pageInfo">

第1页

</span>



<button onclick="nextPage()">

下一页

</button>



<span id="totalInfo">

总人数0

</span>


</div>






</div>



</div>









<!-- 学生详情 -->


<div class="modal" id="detailModal">


<div class="modal-content">


<h3>

学生档案

</h3>



<p>
姓名：
<span id="d_name"></span>
</p>


<p>
学校：
<span id="d_school"></span>
</p>


<p>
手机号：
<span id="d_phone"></span>
</p>


<p>
专业：
<span id="d_major"></span>
</p>


<p>
层次：
<span id="d_level"></span>
</p>


<p>
入学时间：
<span id="d_year"></span>
</p>



<button onclick="closeDetail()">

关闭

</button>


</div>


</div>









<!-- 添加编辑 -->


<div class="modal" id="modal">


<div class="modal-content">


<h3 id="title">

新增学生

</h3>



<input id="name" placeholder="姓名">


<input id="school" placeholder="学校">


<input id="phone" placeholder="手机号">


<input id="major" placeholder="专业">


<input id="level" placeholder="层次">


<input id="year" placeholder="入学时间">



<button onclick="saveStudent()">

保存

</button>



<button onclick="closeModal()">

取消

</button>



</div>


</div>






<script src="js/script.js"></script>


</body>

</html>
