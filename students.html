<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>成人教育平台管理</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


</head>


<body>



<!-- 顶部导航 -->

<header class="top-header">


<div class="system-name">

成人教育平台管理

</div>



<div class="admin-info">

超级管理员


<button onclick="logout()">

退出登录

</button>


</div>


</header>






<div class="main-layout">





<!-- 左侧菜单 -->

<aside class="left-menu">


<div class="menu-title">

学生管理

</div>



<ul>


<li onclick="toggleChenggao()">

📚 成高学生

</li>


<ul id="chenggaoYears"></ul>



<li onclick="loadCategory('自考')">

📖 自考学生

</li>




<li onclick="showGraduated()">

🎓 已毕业名单

</li>



<li>

📊 数据统计

</li>



<li>

⚙ 系统设置

</li>


</ul>


</aside>








<!-- 右侧内容 -->

<section class="content-area">





<!-- 搜索区域 -->


<div class="search-panel">



<input

id="search"

placeholder="搜索姓名/手机号/专业"

>




<button onclick="searchStudent()">

搜索

</button>





<input

type="file"

id="excelFile"

accept=".xlsx,.xls"

>




<button onclick="importExcel()">

导入

</button>





<button onclick="exportExcel()">

导出

</button>



</div>








<h2 id="pageTitle">

成高学生

</h2>




<div id="yearList">

</div>







<!-- 学生表格 -->

<div class="table-panel">


<table>


<thead id="tableHead">


</thead>





<tbody id="list">


</tbody>



</table>



</div>









<!-- 分页 -->


<div class="pagination">



<button onclick="prevPage()">

上一页

</button>




<span id="pageInfo">

第1页

</span>




<button onclick="nextPage()">

下一页

</button>




<span id="totalInfo">

人数：0

</span>



</div>





</section>



</div>









<!-- 学生详情弹窗 -->


<div class="modal" id="detailModal">



<div class="modal-box">



<h3>

学生档案

</h3>





<p>

姓名：

<span id="d_name"></span>

</p>






<p>

学校：

<span id="d_school"></span>

</p>





<p>

身份证：

<span id="d_idcard"></span>

</p>





<p>

手机号：

<span id="d_phone"></span>

</p>






<p>

专业：

<span id="d_major"></span>

</p>






<p>

层次：

<span id="d_level"></span>

</p>






<p>

入学时间：

<span id="d_year"></span>

</p>






<button onclick="closeDetail()">

关闭

</button>





</div>


</div>









<!-- 编辑弹窗 -->

<div class="modal" id="modal">


<div class="modal-box">


<h3 id="title">

编辑学生

</h3>




<input id="name" placeholder="姓名">


<input id="school" placeholder="学校">


<input id="idcard" placeholder="身份证">


<input id="phone" placeholder="手机号">


<input id="major" placeholder="专业">


<input id="level" placeholder="层次">


<input id="year" placeholder="入学时间">




<button onclick="saveStudent()">

保存

</button>




<button onclick="closeModal()">

关闭

</button>



</div>


</div>









<script src="js/script.js"></script>



</body>


</html>
