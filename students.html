<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>成人教育平台管理</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


</head>


<body>



<!-- 顶部导航 -->

<header class="top-header">


<div class="system-name">

成人教育平台管理

</div>



<div class="admin-info">

超级管理员

<button onclick="logout()">

退出登录

</button>


</div>


</header>






<div class="main-layout">





<!-- 左侧菜单 -->

<aside class="left-menu">


<div class="menu-title">

学生管理

</div>



<ul>


<li onclick="toggleChenggao()">

📚 成高学生

</li>
<ul id="chenggaoYears"></ul>

<li onclick="loadCategory('自考')">

📖 自考学生

</li>


<li onclick="showGraduated()">

🎓 已毕业名单

</li>


<li>

📊 数据统计

</li>


<li>

⚙ 系统设置

</li>


</ul>


</aside>







<!-- 右侧内容 -->


<section class="content-area">





<!-- 搜索工具 -->


<div class="search-panel">


<input
id="search"
placeholder="搜索姓名/手机号/专业/年份"
>


<button onclick="searchStudent()">
搜索
</button>


<input

type="file"

id="excelFile"

accept=".xlsx,.xls"

>


<button onclick="importExcel()">
导入
</button>



<button onclick="exportExcel()">
导出
</button>


</div>







<h2 id="pageTitle">

成高学生

</h2>

<div id="yearList"></div>





<!-- 表格 -->


<div class="table-panel">


<table>


<thead>


<tr>


<th>姓名</th>

<th class="pc-col">学校</th>

<th class="pc-col">身份证</th>

<th>手机号</th>

<th>专业</th>

<th>层次</th>

<th class="pc-col">入学时间</th>

<th class="pc-col">操作</th>


</tr>


</thead>



<tbody id="list">


</tbody>



</table>


</div>









<!-- 分页 -->


<div class="pagination">


<button onclick="prevPage()">

上一页

</button>



<span id="pageInfo">

第1页

</span>



<button onclick="nextPage()">

下一页

</button>



<span id="totalInfo">

人数：0

</span>



</div>




</section>



</div>








<!-- 学生详情弹窗 -->


<div class="modal" id="detailModal">


<div class="modal-box">


<h3>

学生档案

</h3>



<p>
姓名：
<span id="d_name"></span>
</p>



<p>
学校：
<span id="d_school"></span>
</p>

<p>
身份证：
<span id="d_idcard"></span>
</p>

<p>
手机号：
<span id="d_phone"></span>
</p>



<p>
专业：
<span id="d_major"></span>
</p>



<p>
层次：
<span id="d_level"></span>
</p>



<p>
入学时间：
<span id="d_year"></span>
</p>



<button onclick="closeDetail()">

关闭

</button>



</div>


</div>




<script src="js/script.js"></script>


</body>


</html>
